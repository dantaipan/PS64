# PS64 settings. One "key = value" per line; same names as the
# command-line options without the leading "--". The app updates the
# c64, password and browse-dir lines itself when you choose them in its menu.

# The C64 Ultimate to show and control. Leave it unset and the app searches
# the network and lets you pick one (Options > Choose C64... to change it).
# "none" means don't control a C64: start its streams from the C64's menu.
# "emulator" uses the built-in emulator (VICE) instead of a C64 Ultimate.
# c64 = 192.168.1.64

# Network password, if one is set on the Ultimate.
# password = secret

# Audio buffer in milliseconds; raise it if you hear crackles.
audio-latency = 60

# no-audio = 1

# ---- Controller -> C64 ------------------------------------------------
# joystick-port = 2

# Shortcut buttons. Values: a C64 key (space, return, run_stop, f1..f8,
# home, clr, del, inst, cursor_up/down/left/right, a..z, 0..9, pound,
# arrow_up, arrow_left, restore, ...), "menu" (Ultimate menu) or "none".
# button-square   = space
# button-triangle = return
# button-circle   = run_stop
# button-l1 = f1
# button-r1 = f3
# button-l2 = f5
# button-r2 = f7

# Built-in emulator: where its games are (default: games/ next to this file),
# and the D-pad as joystick (default) or cursor keys ("keys").
# games-dir = /data/homebrew/PS64/games
# dpad = joystick

# Folder the file browser (L3) opens in.
# browse-dir = /SD

# Folders the search index covers (comma-separated).
# search-roots = /SD,/USB0

# Assembly64 online search: the client ID from the Assembly64 team. The app
# asks for it the first time you open Search Assembly64 and saves it here.
# assembly64-client-id = your-id
# assembly64-url = http://hackerswithstyle.se/leet
